<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">于文涛 · jackwentao</title>
  <desc id="desc">AI applications, agents and RAG. 把想法落地，把经验分享。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2c"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74e6d5"/><stop offset="1" stop-color="#8b9bff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#426b89" stop-opacity=".23"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9fb3c8" stroke-opacity=".06"/></pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', monospace; }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>

  <rect x="1" y="1" width="1198" height="348" rx="22" fill="url(#bg)" stroke="#273949"/>
  <rect x="1" y="1" width="1198" height="348" rx="22" fill="url(#grid)"/>
  <ellipse cx="1020" cy="120" rx="370" ry="290" fill="url(#glow)"/>
  <path d="M60 48h28" stroke="#74e6d5" stroke-width="3" stroke-linecap="round"/>
  <text x="101" y="53" class="mono" font-size="15" letter-spacing="2" fill="#9cb1c7">BUILD · LEARN · SHARE</text>
  <text x="57" y="135" font-size="67" font-weight="750" letter-spacing="-2" fill="#f0f6fc">Hi, I'm <tspan fill="#90e5dc">jackwentao.</tspan></text>
  <text x="61" y="183" font-size="24" fill="#c3d0df">于文涛 / 大模型应用开发者</text>
  <text x="61" y="226" font-size="22" fill="#a0b2c7">把想法落地，把经验分享。</text>
  <g class="mono" font-size="13" letter-spacing="1.4" fill="#b4c8da">
    <rect x="60" y="267" width="106" height="32" rx="16" fill="#142b31" stroke="#2b5556"/><text x="83" y="288" fill="#91e4d5">AGENTS</text>
    <rect x="176" y="267" width="74" height="32" rx="16" fill="#192635" stroke="#34465e"/><text x="199" y="288">RAG</text>
    <rect x="260" y="267" width="120" height="32" rx="16" fill="#20243d" stroke="#444665"/><text x="283" y="288" fill="#b7bbff">BACKEND</text>
  </g>
  <g transform="translate(835 48)">
    <text x="2" y="7" class="mono" font-size="11" letter-spacing="2" fill="#708aa2">IDEA → WORKFLOW → PRODUCT</text>
    <path id="circuit" d="M38 75H128Q148 75 148 95V120Q148 140 168 140H247V225H38V75" fill="none" stroke="#365263" stroke-width="2"/>
    <circle r="4" fill="#8aebda" class="signal"><animateMotion dur="9s" repeatCount="indefinite" path="M38 75H128Q148 75 148 95V120Q148 140 168 140H247V225H38V75"/></circle>
    <rect x="0" y="46" width="119" height="59" rx="12" fill="#142730" stroke="#3b646a"/><circle cx="21" cy="75" r="4" fill="#8aebda"/><text x="35" y="80" class="mono" font-size="13" fill="#c1eee5">RETRIEVE</text>
    <rect x="190" y="111" width="111" height="59" rx="12" fill="#20263d" stroke="#555d89"/><circle cx="210" cy="140" r="4" fill="#aaaaff"/><text x="224" y="145" class="mono" font-size="13" fill="#d0d0ff">REASON</text>
    <rect x="0" y="196" width="119" height="59" rx="12" fill="#142730" stroke="#3b646a"/><circle cx="21" cy="225" r="4" fill="#8aebda"/><text x="35" y="230" class="mono" font-size="13" fill="#c1eee5">EXECUTE</text>
    <text x="191" y="260" class="mono" font-size="11" fill="#708aa2">human + AI</text>
  </g>

</svg>
