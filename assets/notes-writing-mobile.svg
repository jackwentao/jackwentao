<svg xmlns="http://www.w3.org/2000/svg" width="480" height="194" viewBox="0 0 480 194" role="img" aria-labelledby="title desc" font-family="'Segoe Print', 'Comic Sans MS', 'PingFang SC', sans-serif" fill="#2D2D2D">
  <defs>
